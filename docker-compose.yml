services:
  # --- СЕРВИС ИГРЫ ---
  game-app:
    build: .
    container_name: music-quiz-game
    restart: always
    # ИСПРАВЛЕНИЕ: Запускаем через Gunicorn + Eventlet для стабильности
    command: gunicorn -k eventlet -w 1 --bind 0.0.0.0:5000 --timeout 120 --access-logfile - --error-logfile - game_app:app
    # Порты можно не пробрасывать наружу (5002), если есть Nginx на 80 порту.
    # Но для отладки можно оставить.
    expose:
      - "5000"
    environment:
      - GENERATOR_URL=http://generator:5001
      - FLASK_ENV=production
    volumes:
      - ./media:/app/media
      - ./templates:/app/templates
    depends_on:
      - generator

  # --- ГЕНЕРАТОР (НЕЙРОСЕТИ) ---
  generator:
    build: .
    container_name: music-quiz-generator
    restart: always
    command: python generator_service.py
    ports:
      - "5001:5001"
    environment:
      # Убедитесь, что IP правильный и доступен из контейнера
      - OLLAMA_HOST=http://192.168.1.142:11434
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - HF_HOME=/app/whisper_cache
      - TORCH_HOME=/app/whisper_cache
      # Токен нужен только если модель WhisperX требует авторизации (обычно нет для large-v3)
      - HF_TOKEN=hf
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
    volumes:
      - ./media:/app/media
      - ./whisper_cache:/app/whisper_cache
      - ./mdx_cache:/app/mdx_cache
  # --- NGINX (ВХОДНАЯ ТОЧКА) ---
  nginx:
    image: nginx:alpine
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./media:/usr/share/nginx/html/media
    depends_on:
      - game-app  # <--- ИСПРАВЛЕНО ИМЯ (было game)
    restart: always
